[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ops"
version = "0.1.0"
description = "Enterprise operations agent and sandbox for a pre-registered test of GUARD self-improvement"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
ops-agent = "enterprise_ops.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.package-data]
enterprise_ops = [
  "storage/migrations/*.sql",
  "fixtures/scenarios/*.json",
  "agent/harnesses/*/AGENT.md",
  "agent/harnesses/*/manifest.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
