[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ops"
version = "0.1.0"
description = "Deterministic enterprise operations sandbox"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.package-data]
enterprise_ops = ["storage/migrations/*.sql", "fixtures/scenarios/*.json", "agent/harnesses/*/AGENT.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
