name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test --no-install-project
      - run: .venv/bin/python -m pytest -q
        env:
          PYTHONPATH: src:.
